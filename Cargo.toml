[package]
name = "pixi-oci"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Build OCI container images straight from a pixi.lock, without a Dockerfile or a Docker daemon"
license = "Apache-2.0"
repository = "https://github.com/millsks/pixi-oci"
readme = "README.md"
keywords = ["pixi", "oci", "container", "conda"]
categories = ["command-line-utilities", "development-tools"]
publish = false

# The library is the binary's insides, exposed so the tests can reach them; it is not a designed API and makes no
# stability promise.
[lib]
name = "pixi_oci"
path = "src/lib.rs"

[[bin]]
name = "pixi-oci"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
miette = { version = "7.6.0", features = ["fancy"] }
# ELF reading for `check`; already in the build through miette's backtrace, with these same features.
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
rattler = { version = "=0.55.8", default-features = false }
rattler_conda_types = { version = "=0.58.4", default-features = false }
rattler_digest = { version = "=2.1.0", default-features = false }
rattler_networking = { version = "=0.34.9", default-features = false, features = ["system-integration"] }
rattler_lock = { version = "=0.34.15", default-features = false }
rattler_package_streaming = { version = "=0.28.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
url = "2"
# Wheels are zip archives; already in the build through rattler_package_streaming, which reads .conda files with it.
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
ureq = { version = "3.4.2", default-features = false, features = [
  "rustls",
  "gzip",
  "platform-verifier",
  "socks-proxy",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
