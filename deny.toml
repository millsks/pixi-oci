# What this project will accept in its own dependency tree. `pixi run deny` checks it locally; CI runs it on every
# pull request that changes dependencies, and on main.

[graph]
# Only what we ship: default features, for the targets releases will be built for.
all-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
# Every RUSTSEC advisory fails the build. One with no fix yet goes here with the issue that tracks getting off it.
ignore = [
  # unsafe-libyaml is unmaintained (archived 2024-03-25), not vulnerable. It comes in through serde_yaml in
  # rattler_conda_types and rattler_lock; pixi-sbom tracks the same upstream move in aesir-oss/pixi-sbom#21.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, via serde_yaml in rattler" },
  # astral-tokio-tar is unmaintained (deprecated 2026-11-03), not vulnerable. rattler_package_streaming uses it for
  # async extraction, which pixi-oci does not call; every rattler_package_streaming release still depends on it.
  { id = "RUSTSEC-2026-0440", reason = "unmaintained, via rattler_package_streaming; its async path is unused" },
  # humantime is unmaintained (2026-11, because chrono is), not vulnerable, with no release to move to. rattler and
  # rattler_config use it to parse and print durations in pixi's config.
  { id = "RUSTSEC-2026-0542", reason = "unmaintained, via rattler and rattler_config; no safe upgrade exists" },
]

[licenses]
version = 2
# The permissive set. Unicode-3.0 is the ICU crates behind URL parsing; MPL-2.0 is file-level copyleft that a
# binary distribution of unmodified files does not trigger.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  # libbz2-rs-sys, which reads conda's .tar.bz2 packages. BSD-like: attribution, no warranty, no obligation on us.
  "bzip2-1.0.6",
  # webpki-root-certs, the Mozilla root store rustls falls back to. CDLA-Permissive-2.0 is a permissive data license.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
