[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "pixi-oci"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
version = "0.1.0"
exclude-newer = "7d"

[dependencies]
rust = "==1.98.1"

[target.linux.dependencies]
compilers = ">=1.7.0"

[tasks]
fmt = "cargo fmt"
lint = "cargo clippy --all-targets -- -D warnings"
check = "cargo check --all-targets"
test = "cargo test"
build = "cargo build --release"
# The fixture lockfile the CLI tests read, re-locked from its manifest.
fixture = { cmd = "pixi lock", cwd = "tests/fixtures/workspace", description = "re-lock tests/fixtures/workspace" }
# The examples under examples/projects/pixi: plan every one (offline), re-lock one, or build one on a base and check it.
examples-plan = { cmd = "cargo test --test examples", description = "plan every example, for both platforms" }

[tasks.examples-lock]
description = "re-lock one example: pixi run examples-lock 03-flask"
args = [{ arg = "name" }]
cmd = "pixi lock --manifest-path examples/projects/pixi/{{ name }}/pixi.toml"

[tasks.examples-build]
description = "build one example on a base and check it: pixi run examples-build 03-flask gunicorn"
args = [
  { arg = "name" },
  { arg = "entrypoint", default = "python" },
  { arg = "platform", default = "linux-64" },
  { arg = "base", default = "registry.access.redhat.com/ubi9/ubi-minimal@sha256:baafce2d34783a28b4a472779f304e97e00f9d35c99553bc53b068b14344d9a9" },
]
cmd = "cargo run --release -- build --lockfile examples/projects/pixi/{{ name }}/pixi.lock -p {{ platform }} --base {{ base }} --entrypoint {{ entrypoint }} -t {{ name }}:latest -o target/examples/{{ name }}.tar --force && cargo run --release -- check target/examples/{{ name }}.tar"

# The oldest toolchain the crate claims to build on. `pixi run -e msrv msrv-check` proves the number in Cargo.toml
# rather than trusting it.
[feature.msrv.dependencies]
rust = "==1.95.0"

[feature.msrv.tasks]
msrv-check = "cargo check --all-targets --locked"

[feature.lint.dependencies]
cargo-deny = "*"
pre-commit = "*"
pre-commit-hooks = "*"
taplo = "*"
typos = "*"
actionlint = ">=1.7.12,<2"

[feature.lint.tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Advisories, licenses, banned crates and sources, against deny.toml.
deny = "cargo deny check"
actionlint = "actionlint"
pre-commit-run = "pre-commit run --all-files"

[feature.cov.dependencies]
cargo-llvm-cov = "*"

[feature.cov.tasks]
cov = "cargo llvm-cov --all-targets --fail-under-lines 90"

# The site toolchain comes from PyPI rather than conda-forge, as in aesir-oss/pixi-sbom: conda-forge's mkdocs build
# caps click below the release that fixes PYSEC-2026-2132. click is taken from conda-forge at the fixed release, so the
# PyPI solve sees it as satisfied and cannot pull a capped one.
[feature.docs.dependencies]
python = "3.14.*"
click = ">=8.3.3"

[feature.docs.pypi-dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6"
pymdown-extensions = ">=10"
mike = ">=2.1"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

[feature.dev.tasks]
ci = { depends-on = ["pre-commit-run", "build", "check", "lint", "cov"] }

[environments]
default = ["lint", "cov", "dev"]
lint = { features = ["lint"], no-default-feature = true }
msrv = { features = ["msrv"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
