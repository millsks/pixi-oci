name: Bug report
description: pixi oci did something wrong, or an image it built does not work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not open an issue: see [SECURITY.md](https://github.com/millsks/pixi-oci/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
      placeholder: |
        pixi oci build -e app -p linux-64 -o app.tar
        Expected an image; got ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output, including the error. Remove any credentials.
      render: text
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A `pixi.toml` (or the relevant part of `pixi.lock`) and the commands, if you can share them.
  - type: input
    id: version
    attributes:
      label: pixi-oci version
      description: "`pixi oci --version`"
      placeholder: pixi-oci 0.1.0
    validations:
      required: true
  - type: input
    id: pixi-version
    attributes:
      label: pixi version
      description: "`pixi --version`"
  - type: dropdown
    id: host
    attributes:
      label: Host OS
      options:
        - Windows
        - macOS
        - Linux
        - CI runner (say which below)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Image platform
      description: The `--platform` you built for.
      placeholder: linux-64
