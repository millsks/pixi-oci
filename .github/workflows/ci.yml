name: CI

on:
  push:
    branches: ["main"]
  # Every pull request, whatever its base, so a PR stacked on another one is checked too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces the run; every commit on main gets a complete one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pre-commit
        run: pixi run pre-commit-run
      - name: cargo fmt / clippy / check
        run: |
          pixi run cargo fmt --check
          pixi run lint
          pixi run check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit + integration tests
        # The network test builds a real image from conda-forge and runs its python; it needs a Linux host.
        env:
          PIXI_OCI_NETWORK_TESTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: pixi run test

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo llvm-cov (>= 90% lines)
        run: pixi run cov

  deny:
    name: Dependency advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: lint
          cache: true
      - name: cargo deny
        run: pixi run -e lint deny

  # Every other job builds on the newer rustc the default environment pins; this one proves the MSRV.
  msrv:
    name: Builds on the MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: msrv
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on the oldest supported toolchain
        run: pixi run -e msrv msrv-check

  # The same lockfile must give the same image on every host: a developer on Windows builds what CI tests on Linux.
  digest:
    name: Image digest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the fixture image for linux-64 and linux-aarch64
        run: |
          pixi run cargo build --release
          for platform in linux-64 linux-aarch64; do
            ./target/release/pixi-oci build --lockfile tests/fixtures/workspace/pixi.lock \
              -e app -p "$platform" -o "app-$platform.tar" | tee "build-$platform.txt"
            grep -o 'sha256:[0-9a-f]*' "build-$platform.txt" | head -1 > "digest-$platform.txt"
          done
          cat digest-*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}
          path: digest-*.txt

  same-digest:
    name: Same image on every host
    needs: [digest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
      - name: Compare
        run: |
          status=0
          for platform in linux-64 linux-aarch64; do
            echo "$platform:"
            for file in digest-*/digest-"$platform".txt; do echo "  ${file%%/*}: $(cat "$file")"; done
            if [ "$(cat digest-*/digest-"$platform".txt | sort -u | wc -l)" -ne 1 ]; then
              echo "::error::the $platform image differs between hosts"
              status=1
            fi
          done
          exit $status

  # The one check a branch protection rule needs to require.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [lint, test, coverage, deny, msrv, digest, same-digest]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job ended $result"; exit 1 ;;
            esac
          done
