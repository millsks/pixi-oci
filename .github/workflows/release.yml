name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N, published as a prerelease) builds pixi-oci for six targets and publishes them on a
# GitHub release with their sha256 sums. The tag must match Cargo.toml's version. Pull requests that touch this file
# build every target without publishing, so the workflow is proven before a tag needs it.
#
# Linux binaries are static (musl), so they run on any distribution, old glibc or none.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain pixi.toml pins, so a release builds with the compiler CI tested.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          # GCC's outline atomics call libgcc helpers a static musl link lacks (vendored libdbus uses them).
          if [[ "$TARGET" == aarch64-* ]]; then
            echo "CFLAGS_${TARGET//-/_}=-mno-outline-atomics" >> "$GITHUB_ENV"
          fi
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
      - name: cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          name="pixi-oci-${version}-${TARGET}"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/pixi-oci.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            archive="$name.zip"
          else
            cp "target/$TARGET/release/pixi-oci" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Runs
        # Every runner's own architecture, except x86_64 macOS, which Rosetta runs.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe="target/$TARGET/release/pixi-oci"
          [[ "$TARGET" == *windows* ]] && exe="$exe.exe"
          "$exe" --version
          if [[ "$TARGET" == *linux* ]]; then
            file "$exe"
            if ldd "$exe" 2>/dev/null | grep -q '=>'; then echo "not static"; exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      actions: write # the docs deploy, which a release made with this token does not trigger by itself
    steps:
      - uses: actions/checkout@v4
      - name: The tag is Cargo.toml's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: sha256 sums
        working-directory: dist
        run: sha256sum pixi-oci-* | tee SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"
      - name: Docs for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main -f ref="$GITHUB_REF_NAME"
