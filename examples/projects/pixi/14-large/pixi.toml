# Data science, machine learning, geospatial and Jupyter: a few hundred packages.
[workspace]
name = "large"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.13.*"
# tk, which conda-forge's python depends on, links to X11: without it `check` reports libX11.so.6.
xorg-libx11 = "*"
jupyterlab = "*"
pandas = "*"
polars = "*"
scipy = "*"
scikit-learn = "*"
matplotlib = "*"
seaborn = "*"
pytorch = "*"
dask = "*"
sqlalchemy = "*"
pyarrow = "*"
statsmodels = "*"
xgboost = "*"
gdal = "*"
