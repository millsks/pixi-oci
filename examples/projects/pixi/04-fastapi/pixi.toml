# A FastAPI service run by uvicorn.
[workspace]
name = "fastapi"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.13.*"
# tk, which conda-forge's python depends on, links to X11: without it `check` reports libX11.so.6.
xorg-libx11 = "*"
fastapi = "*"
uvicorn = "*"

# Set by `pixi run` and, with pixi-oci, in the image: logs reach the container's output at once.
[activation.env]
PYTHONUNBUFFERED = "1"

# `pixi run serve` here, and the image's entrypoint with `pixi oci build --task serve`.
[tasks]
serve = { cmd = "uvicorn main:app --host 0.0.0.0 --port 8000", cwd = "app" }

# The image, for `pixi oci build api`: the same settings as the README's flags. Paths are relative to this file, and
# the image is written beside it as api.tar.
[tool.pixi-oci.images.api]
platform = "linux-64"
base = "debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc"
add = ["app:/app"]
task = "serve"
expose = [8000]
tag = "04-fastapi:latest"
